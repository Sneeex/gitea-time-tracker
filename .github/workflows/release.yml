name: Build & Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Release Binary
        run: |
          swift build -c release
          mkdir -p build/GiteaTimeTracker.app/Contents/MacOS build/GiteaTimeTracker.app/Contents/Resources
          cp .build/release/GiteaTimeTracker build/GiteaTimeTracker.app/Contents/MacOS/
          
          # Extract clean version (e.g., "1.0.7" from tag "v1.0.7")
          RAW_VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VERSION:-1.0.7}"

          # Create Info.plist inside bundle
          cat << EOF > build/GiteaTimeTracker.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GiteaTimeTracker</string>
              <key>CFBundleIdentifier</key>
              <string>com.antigravity.gitea-time-tracker</string>
              <key>CFBundleName</key>
              <string>Gitea Time Tracker</string>
              <key>CFBundleDisplayName</key>
              <string>Gitea Time Tracker</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign app bundle
          codesign --force --deep --sign - build/GiteaTimeTracker.app
          
          # Create zip archive for release
          cd build && zip -r GiteaTimeTracker.zip GiteaTimeTracker.app

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          
          # Extract section for this version from CHANGELOG.md
          awk '/^## \['"${VERSION}"'\]/{flag=1; print; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          
          # Fallback if section wasn't found
          if [ ! -s release_notes.md ]; then
            echo "## Gitea Time Tracker ${GITHUB_REF_NAME}" > release_notes.md
          fi
          
          cat << 'EOF' >> release_notes.md

---
### Installation
Download `GiteaTimeTracker.zip` below, unzip it, and move `GiteaTimeTracker.app` to your `/Applications` folder.

**First-time Launch Note (Gatekeeper):**
If macOS displays a warning on first launch, run:
```bash
xattr -cr /Applications/GiteaTimeTracker.app
```
EOF

          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/Sneeex/gitea-time-tracker/compare/${PREV_TAG}...${GITHUB_REF_NAME}" >> release_notes.md
          fi

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/GiteaTimeTracker.zip
          name: ${{ github.ref_name }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
